<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Deletion | Injabulo Clinic</title>
    <style>
        body { margin: 0; padding: 25px; font-family: Arial, sans-serif; background: #F7F2E9; color: #292929; }
        .panel { max-width: 520px; margin: 90px auto; padding: 30px; background: white; border: 1px solid #e9e4dc; border-radius: 10px; text-align: center; }
        h1 { color: #206F74; }
        p { color: #777; line-height: 1.7; }
        .actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 25px; }
        button, a { padding: 12px 18px; border: 0; border-radius: 6px; text-decoration: none; cursor: pointer; font-size: 14px; }
        button { background: #a33b3b; color: white; }
        a { background: #eae7e0; color: #292929; }
    </style>
</head>
<body>
    <div class="panel">
        <h1>Delete Service?</h1>
        <p>Are you sure you want to delete <strong>{{ service.title }}</strong>?</p>
        <p>This action cannot be undone. If you only want to hide this service, edit it and uncheck the publish option instead.</p>

        <div class="actions">
            <form method="post">
                {% csrf_token %}
                <button type="submit">Yes, Delete Service</button>
            </form>
            <a href="{% url 'dashboard:service_list' %}">Cancel</a>
        </div>
    </div>
</body>
</html>
